name: Release

# Runs when a semver tag is pushed, e.g. v1.0.0 or v1.1.0-rc.1.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write # create the release and upload its files

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous tag, for the changelog link

      # The release notes are the annotated tag's message, after its first line (the title).
      # checkout may leave the tag lightweight, so fetch the tag object itself.
      - name: Release notes from the tag
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          git fetch --force origin "refs/tags/$VERSION:refs/tags/$VERSION"
          if [ "$(git cat-file -t "$VERSION")" != tag ]; then
            echo "::error::$VERSION is not an annotated tag; its message holds the release notes"
            exit 1
          fi
          git tag -l --format='%(contents:body)' "$VERSION" > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::the tag message of $VERSION has no release notes after its first line"
            exit 1
          fi
          prev=$(git describe --tags --abbrev=0 "$VERSION^" 2>/dev/null || true)
          if [ -n "$prev" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$REPO" "$prev" "$VERSION" >> notes.md
          fi
          cat notes.md

      # A tag pushed again (to fix its notes) updates the existing release's notes and stops.
      - name: Existing release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" --notes-file notes.md
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-go@v5
        if: steps.existing.outputs.done != 'true'
        with:
          go-version-file: go.mod

      - name: Test
        if: steps.existing.outputs.done != 'true'
        run: go test ./...

      - name: Build binaries
        if: steps.existing.outputs.done != 'true'
        env:
          VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="tdash_${VERSION}_${os}_${arch}"
            bin="tdash"
            [ "$os" = windows ] && bin="tdash.exe"

            mkdir -p "build/$name"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/$name/$bin" .
            cp -R README.md SPEC.md examples "build/$name/"

            # The bare binary, plus an archive with the README, the spec and the example dashboards.
            if [ "$os" = windows ]; then
              cp "build/$name/$bin" "dist/$name.exe"
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              cp "build/$name/$bin" "dist/$name"
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -l dist

      - name: Create release
        if: steps.existing.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$VERSION" dist/* \
            --title "tdash $VERSION" \
            --notes-file notes.md \
            --verify-tag \
            "${flags[@]}"
